name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      # Build-time only — a real DB/secret is never needed to lint, typecheck
      # or build. Nothing here talks to the production server or database.
      DATABASE_URL: "file:./ci.db"
      SESSION_SECRET: "ci-placeholder-secret-not-used-in-production"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx prisma generate

      - run: npm run lint

      - run: npm run typecheck

      - run: npm run build

      - name: Audit for known-vulnerable dependencies
        run: npm audit --audit-level=high
